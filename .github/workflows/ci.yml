name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Count chapters
        run: |
          echo "Text files in repo:"
          ls *.txt | wc -l

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-demo/package-lock.json

      - name: Install dependencies
        working-directory: react-demo
        run: npm ci

      - name: Run tests
        working-directory: react-demo
        run: npm test
